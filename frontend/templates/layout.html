<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI Glaucoma Screening{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
   <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
                <span class="brand-mark" aria-hidden="true">E</span>
                EyeCheck
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'glaucoma' %}active{% endif %}" href="{{ url_for('glaucoma') }}" {% if request.endpoint == 'glaucoma' %}aria-current="page"{% endif %}>About Glaucoma</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint in ['upload', 'predict'] %}active{% endif %}" href="{{ url_for('upload') }}" {% if request.endpoint in ['upload', 'predict'] %}aria-current="page"{% endif %}>Screen an image</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>About Project</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'contact' %}active{% endif %}" href="{{ url_for('contact') }}" {% if request.endpoint == 'contact' %}aria-current="page"{% endif %}>Contact</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Main Content -->

    <main class="container page-container">

        {% block content %}

        {% endblock %}

    </main>

    <!-- Footer -->

    <footer class="site-footer text-center py-4 mt-5">
        <div class="container">
            <p class="mb-1">AI-assisted glaucoma screening</p>
            <small>For educational and research use. Not a medical diagnosis.</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
